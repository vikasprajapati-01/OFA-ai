# Self-contained local lab: everything runs in Docker with dummy credentials (test mode).
#   docker compose up -d --build --scale app=2
#   docker compose restart nginx        (needed after scaling, so Nginx sees every app container)
x-lab-env: &lab-env
  LOAD_TEST: "true"
  LOAD_TEST_SECRET: lab-secret
  METRICS: "true"
  QUEUE_ENABLED: "true"
  CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
  CLERK_SECRET_KEY: sk_test_lab_dummy
  CLOUDINARY_CLOUD_NAME: lab
  CLOUDINARY_API_KEY: lab
  CLOUDINARY_API_SECRET: lab
  GEMINI_API_KEY: lab
  CLIPDROP_API_KEY: lab
  LOCAL_DATABASE_URL: postgres://postgres:lab@postgres:5432/loadtest
  REDIS_URL: redis://redis:6379
  PG_POOL_MAX: "15"
  RATE_LIMIT_PER_MIN: "100000"
  FAKE_AI_FAIL_RATE: "${FAKE_AI_FAIL_RATE:-0}"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: loadtest
    volumes:
      - ./loadtest/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d loadtest"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: ./backend
    environment:
      <<: *lab-env
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["node", "worker.js"]
    environment:
      <<: *lab-env
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-5}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:
